services:
  prometheus:
    build:
      context: ./prometheus
      args:
        PROMETHEUS_BASE_IMAGE: ${PROMETHEUS_BASE_IMAGE}
    restart: unless-stopped
    environment:
      PROMETHEUS_RETENTION_TIME: ${PROMETHEUS_RETENTION_TIME}
      PROMETHEUS_POSTGRES_EXPORTER_TARGET: ${PROMETHEUS_POSTGRES_EXPORTER_TARGET}
      PROMETHEUS_NODE_EXPORTER_TARGET: ${PROMETHEUS_NODE_EXPORTER_TARGET}
    expose:
      - "9090"
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:
