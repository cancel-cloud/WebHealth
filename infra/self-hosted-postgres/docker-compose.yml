services:
  postgres:
    build:
      context: ./postgres
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
      POSTGRES_DIRECT_USER: ${POSTGRES_DIRECT_USER}
      POSTGRES_DIRECT_PASSWORD: ${POSTGRES_DIRECT_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_MONITORING_USER: ${POSTGRES_MONITORING_USER}
      POSTGRES_MONITORING_PASSWORD: ${POSTGRES_MONITORING_PASSWORD}
      DB_TLS_CERT_PEM: ${DB_TLS_CERT_PEM}
      DB_TLS_KEY_PEM: ${DB_TLS_KEY_PEM}
      PGBACKREST_STANZA: ${PGBACKREST_STANZA}
      PGBACKREST_REPO_RETENTION_FULL: ${PGBACKREST_REPO_RETENTION_FULL}
      PGBACKREST_REPO_RETENTION_DIFF: ${PGBACKREST_REPO_RETENTION_DIFF}
    command:
      - postgres
      - -c
      - config_file=/opt/webhealth/postgresql.conf
      - -c
      - hba_file=/opt/webhealth/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - node-exporter-text:/var/lib/node_exporter/textfile_collector
      - postgres-socket:/var/run/postgresql

  pgbouncer:
    build:
      context: ./pgbouncer
      args:
        PGBOUNCER_BASE_IMAGE: ${PGBOUNCER_BASE_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
      POSTGRES_DIRECT_USER: ${POSTGRES_DIRECT_USER}
      POSTGRES_DIRECT_PASSWORD: ${POSTGRES_DIRECT_PASSWORD}
      POSTGRES_MONITORING_USER: ${POSTGRES_MONITORING_USER}
      POSTGRES_MONITORING_PASSWORD: ${POSTGRES_MONITORING_PASSWORD}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE}
      PGBOUNCER_SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT}
      PGBOUNCER_LISTEN_PORT: ${PGBOUNCER_LISTEN_PORT}
      PGBOUNCER_ADMIN_USERS: ${PGBOUNCER_ADMIN_USERS}
      PGBOUNCER_STATS_USERS: ${PGBOUNCER_STATS_USERS}
      PGBOUNCER_TLS_CERT_FILE: ${PGBOUNCER_TLS_CERT_FILE}
      PGBOUNCER_TLS_KEY_FILE: ${PGBOUNCER_TLS_KEY_FILE}
      DB_TLS_CERT_PEM: ${DB_TLS_CERT_PEM}
      DB_TLS_KEY_PEM: ${DB_TLS_KEY_PEM}
    ports:
      - "${PGBOUNCER_LISTEN_PORT:-6432}:6432"

  pgbackrest:
    build:
      context: ./postgres
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DIRECT_USER: ${POSTGRES_DIRECT_USER}
      POSTGRES_DIRECT_PASSWORD: ${POSTGRES_DIRECT_PASSWORD}
      PGBACKREST_STANZA: ${PGBACKREST_STANZA}
      PGBACKREST_FULL_INTERVAL_SECONDS: ${PGBACKREST_FULL_INTERVAL_SECONDS}
      PGBACKREST_DIFF_INTERVAL_SECONDS: ${PGBACKREST_DIFF_INTERVAL_SECONDS}
      PGBACKREST_LOOP_SLEEP_SECONDS: ${PGBACKREST_LOOP_SLEEP_SECONDS}
      PGBACKREST_REPO_RETENTION_FULL: ${PGBACKREST_REPO_RETENTION_FULL}
      PGBACKREST_REPO_RETENTION_DIFF: ${PGBACKREST_REPO_RETENTION_DIFF}
    command: ["/opt/webhealth/bin/backup-loop.sh"]
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-socket:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - node-exporter-text:/var/lib/node_exporter/textfile_collector

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_MONITORING_USER}:${POSTGRES_MONITORING_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    expose:
      - "9187"
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    expose:
      - "9100"
    volumes:
      - /:/host:ro,rslave
      - node-exporter-text:/var/lib/node_exporter/textfile_collector:ro

  pgadmin:
    image: ${PGADMIN_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: "5050"
    ports:
      - "5050:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgbackrest-repo:
  pgadmin-data:
  node-exporter-text:
  postgres-socket:
